---
- name: Process and install template files
  ansible.builtin.template:
    src: "{{ item.src }}.j2"
    dest: "{{ dns_server_path }}/{{ item.src }}"
  loop:
    - src: docker-compose.yml
    - src: config/Corefile
    - src: config/lan.zone

- name: Run docker compose up -d
  ansible.builtin.command:
    chdir: "{{ dns_server_path }}"
    cmd: "docker compose up -d"
