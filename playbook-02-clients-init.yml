---
- hosts: clients
  tasks:
    - name: Install apt packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        install_recommends: false
        name:
          - default-jdk-headless
          - docker-compose
          - podman
          - podman-docker

    - name: Enable podman socket
      # become: true
      ansible.builtin.systemd:
        daemon_reload: true
        name: "podman.socket"
        enabled: true
        state: started
        scope: user
      tags: ["services"]
